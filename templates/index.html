
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment AI | Review Analyzer</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #f8fafc;
            background: radial-gradient(circle at top, #243b65, #0b1020 65%);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 680px;
            padding: 36px;
            border: 1px solid #34435e;
            border-radius: 24px;
            background: rgba(17, 27, 48, .94);
            box-shadow: 0 24px 70px #0005;
        }

        .tag {
            display: inline-block;
            padding: 8px 12px;
            border-radius: 20px;
            background: #23385a;
            color: #a8d2ff;
            font-size: 13px;
        }

        h1 { font-size: 36px; margin: 20px 0 12px; }
        p { color: #b9c5d8; line-height: 1.6; }

        textarea {
            width: 100%;
            min-height: 160px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid #43516a;
            border-radius: 14px;
            background: #0c1425;
            color: white;
            font: inherit;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 16px;
            padding: 15px;
            border: 0;
            border-radius: 12px;
            background: #76a9ff;
            color: #081326;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled { opacity: .6; cursor: wait; }

        #result {
            display: none;
            margin-top: 22px;
            padding: 18px;
            border-radius: 12px;
            background: #202e46;
            overflow-wrap: anywhere;
        }

        #result strong { font-size: 20px; }
        .note { font-size: 12px; margin-top: 20px; }

        @media (max-width: 500px) {
            .card { padding: 24px; }
            h1 { font-size: 29px; }
        }
    </style>
</head>
<body>
    <main class="card">
        <span class="tag">MACHINE LEARNING PROJECT</span>
        <h1>Sentiment Analyzer</h1>
        <p>Enter a movie review and let the trained machine learning model analyze its sentiment.</p>

        <textarea id="review" placeholder="Example: The movie was excellent and I really enjoyed it..."></textarea>
        <button id="analyze" onclick="analyzeSentiment()">Analyze Sentiment</button>

        <section id="result" aria-live="polite"></section>
        <p class="note">Predictions are generated by a trained model and may not always be correct.</p>
    </main>

    <script>
        async function analyzeSentiment() {
            const review = document.getElementById("review").value.trim();
            const button = document.getElementById("analyze");
            const result = document.getElementById("result");

            result.style.display = "block";

            if (!review) {
                result.textContent = "Please enter a review first.";
                return;
            }

            button.disabled = true;
            button.textContent = "Analyzing...";
            result.textContent = "Analyzing your review...";

            try {
                const response = await fetch("/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ review })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Prediction failed.");
                }

                result.replaceChildren();

                const heading = document.createElement("strong");
                heading.textContent = "Model output: " + data.prediction;
                result.appendChild(heading);

                const detail = document.createElement("p");
                detail.textContent = "Review: " + data.review;
                result.appendChild(detail);
            } catch (error) {
                result.textContent = "Error: " + error.message;
            } finally {
                button.disabled = false;
                button.textContent = "Analyze Sentiment";
            }
        }
    </script>
</body>
</html>
